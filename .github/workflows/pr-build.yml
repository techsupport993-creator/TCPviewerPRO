name: Windows pull request build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Security regression tests
        run: dotnet run --project TCPViewerPro.SecurityTests/TCPViewerPro.SecurityTests.csproj --configuration Release
      - name: Restore
        run: dotnet restore TCPViewerPro/TCPViewerPro.csproj --configfile NuGet.Config -r win-x64
      - name: Publish Windows x64
        run: dotnet publish TCPViewerPro/TCPViewerPro.csproj -c Release -r win-x64 --self-contained true --no-restore /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true
      - name: Verify build artifact
        shell: pwsh
        run: |
          $exe = 'TCPViewerPro/bin/Release/net10.0-windows/win-x64/publish/TCPViewerPro.exe'
          if (-not (Test-Path $exe)) { throw 'EXE was not generated.' }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 50000 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw 'EXE is too small or has an invalid PE signature.'
          }
          (Get-FileHash $exe -Algorithm SHA256).Hash | Write-Host
      - uses: actions/upload-artifact@v6
        with:
          name: tcpviewerpro-pr-windows-x64
          path: TCPViewerPro/bin/Release/net10.0-windows/win-x64/publish/TCPViewerPro.exe
          if-no-files-found: error
