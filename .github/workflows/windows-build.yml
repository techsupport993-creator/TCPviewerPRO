name: Windows build and public release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tcpviewerpro-windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check project version and existing release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content 'TCPViewerPro/TCPViewerPro.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^[0-9]+[.][0-9]+[.][0-9]+$') {
            throw 'Project Version must be three numeric components, e.g. 6.3.0'
          }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Git tag $env:GITHUB_REF_NAME does not match project version $tag"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists; not replacing published binaries."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag does not exist; will publish it after a successful build."
          }
          $global:LASTEXITCODE = 0
      - name: Restore
        run: dotnet restore TCPViewerPro/TCPViewerPro.csproj --configfile NuGet.Config -r win-x64
      - name: Publish Windows x64 standalone EXE
        run: dotnet publish TCPViewerPro/TCPViewerPro.csproj -c Release -r win-x64 --self-contained true --no-restore /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = 'TCPViewerPro/bin/Release/net8.0-windows/win-x64/publish/TCPViewerPro.exe'
          if (-not (Test-Path $exe)) { throw 'Published TCPViewerPro.exe was not found.' }
          ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() + '  TCPViewerPro.exe') |
            Set-Content -Encoding ascii TCPViewerPro.exe.sha256
      - name: Prepare version-labelled download copies
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $source = 'TCPViewerPro/bin/Release/net8.0-windows/win-x64/publish/TCPViewerPro.exe'
          $name = "TCPViewerPro_v$env:VERSION.exe"
          Copy-Item $source $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Encoding ascii "$name.sha256"
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcpviewerpro-windows-x64
          path: |
            TCPViewerPro/bin/Release/net8.0-windows/win-x64/publish/TCPViewerPro.exe
            TCPViewerPro.exe.sha256
            TCPViewerPro_v*.exe
            TCPViewerPro_v*.exe.sha256
          if-no-files-found: error
      - name: Publish public GitHub Release
        if: steps.release.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $exe = 'TCPViewerPro/bin/Release/net8.0-windows/win-x64/publish/TCPViewerPro.exe'
          $checksum = 'TCPViewerPro.exe.sha256'
          $versionedExe = "TCPViewerPro_v$env:VERSION.exe"
          $versionedChecksum = "$versionedExe.sha256"
          $notes = @"
          TCP Viewer Pro v$env:VERSION — Windows 10/11 x64.
          
          Includes the Matrix Green theme, cat application icon, TCP/UDP monitoring, process investigation and opt-in update checks.
          
          Download TCPViewerPro_v$env:VERSION.exe for an easy-to-identify versioned filename, or TCPViewerPro.exe for existing in-app update compatibility. Both contain identical bytes. No Python or separate .NET runtime is needed.
          Check TCPViewerPro.exe.sha256 to verify the download.
          
          Note: The build passed Windows CI but has not been independently runtime-tested or code-signed. Windows may display an unknown-publisher warning.
          "@
          gh release create $env:RELEASE_TAG $exe $checksum $versionedExe $versionedChecksum --repo $env:GITHUB_REPOSITORY --title "TCP Viewer Pro v$env:VERSION" --notes $notes --target $env:GITHUB_SHA --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
